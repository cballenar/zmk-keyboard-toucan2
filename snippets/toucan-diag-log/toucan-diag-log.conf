CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Azoteq driver logs via CONFIG_INPUT_LOG_LEVEL; INF is enough to see init
# success/failure and every I2C error, without flooding on movement.
CONFIG_INPUT_LOG_LEVEL_INF=y

# Zephyr I2C driver errors (bus timeouts, NACKs) and GPIO.
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_INF=y

# Keep boot logs from being dropped before the CDC-ACM port is opened.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000

# Battery reporting on a peripheral logs a DBG line every 60s; that acts as a
# heartbeat proving the console works even when no input events happen.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=5
