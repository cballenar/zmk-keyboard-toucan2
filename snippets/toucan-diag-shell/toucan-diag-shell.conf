CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30

# Poll the matrix instead of relying on GPIOTE interrupts.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Zephyr shell on the same CDC-ACM console: `gpio get`, `i2c scan`, etc.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
# SENSOR_SHELL defaults on with SHELL and selects CBPRINTF_FP_SUPPORT,
# which conflicts with ZMK's minimal printf config.
CONFIG_SENSOR_SHELL=n

# `dfu` command: reboot into the UF2 bootloader without the reset button.
CONFIG_TOUCAN_DIAG_SHELL=y
CONFIG_REBOOT=y
