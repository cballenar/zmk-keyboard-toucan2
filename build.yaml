# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: seeeduino_xiao_ble
    shield: toucan_left rgbled_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
  - board: seeeduino_xiao_ble
    shield: settings_reset

  # --- Diagnostics for the dead right half (see snippets/) ---
  # (a) Stock right-half firmware + USB CDC console with verbose logging.
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
    snippet: toucan-diag-log
    artifact-name: diag_right_log
  # (b) Same, with the trackpad + I2C bus removed: tests the key matrix alone.
  - board: seeeduino_xiao_ble
    shield: toucan_right rgbled_adapter
    snippet: toucan-diag-notp
    artifact-name: diag_right_notp
  # (c) ZMK's XIAO pin tester: each of D0..D10 shorted to GND types "PIN n"
  #     over USB HID. Tests the nRF52840's GPIOs independent of the Toucan PCB.
  - board: seeeduino_xiao_ble
    shield: tester_xiao
    artifact-name: diag_tester_xiao
