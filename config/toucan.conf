# User customization: Shared settings for Toucan 2 split keyboard

# Enter deep sleep after 15 minutes of inactivity (default was 60 min).
# Prevents prolonged Bluetooth connection after host sleeps, avoiding accidental screen wakes.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Increase BLE transmit power to +8 dBm (max) for Seeed Studio XIAO BLE.
# Compensates for the onboard ceramic chip antenna to improve connection stability between split halves and host.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
